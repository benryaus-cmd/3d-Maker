name: Blacktop Empire Build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -p tsconfig.crime.json --noEmit
      - run: node --experimental-strip-types scripts/check-economy.mjs
      - run: node scripts/check-economy-ui.mjs
      - run: node --experimental-strip-types scripts/check-sweep-save.mjs
      - run: node --experimental-strip-types scripts/check-firearms.mjs
      - run: node --experimental-strip-types scripts/check-combat-controls.mjs
      - run: node --experimental-strip-types scripts/check-police-director.mjs
      - run: node --experimental-strip-types scripts/check-empire.mjs
      - run: node --experimental-strip-types scripts/check-combat-effects.mjs
      - run: node --experimental-strip-types scripts/check-district-identity.mjs
      - run: node --experimental-strip-types scripts/check-crime.mjs
      - run: node --experimental-strip-types scripts/check-mobile-controls.mjs
      - run: node --experimental-strip-types scripts/check-world.mjs
      - run: node --experimental-strip-types scripts/check-person-disposal.mjs
      - run: node --experimental-strip-types scripts/check-city-layout.mjs
      - run: node --experimental-strip-types scripts/check-road-assets.mjs
      - run: node --experimental-strip-types scripts/check-traffic.mjs
      - run: node --experimental-strip-types scripts/check-street-combat.mjs
      - run: node --experimental-strip-types scripts/check-daylight.mjs
      - run: node --experimental-strip-types scripts/check-skid-lifetime.mjs
      - run: node --experimental-strip-types scripts/check-impact-immersion.mjs
      - run: pnpm build
